<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="styles.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
	<title>CSS Grid</title>
</head>

<body>
	<main class="container">
		<section class="crono" aria-label="Cronómetro">
			<h2><i class="ti ti-stopwatch" aria-hidden="true"></i> Cronómetro</h2>

			<div class="display">
				<span id="hms">00:00:00</span><span id="ms">.00</span>
			</div>

			<div class="botones">
				<button class="boton start" type="button"><i class="ti ti-player-play" aria-hidden="true"></i>
					Start</button>
				<button class="boton stop oculto" type="button"><i class="ti ti-player-pause" aria-hidden="true"></i>
					Stop</button>
				<button class="boton reset oculto" type="button"><i class="ti ti-refresh" aria-hidden="true"></i>
					Reset</button>
			</div>
		</section>
		<section class="temp" aria-label="Temporizador">
			<h2><i class="ti ti-hourglass" aria-hidden="true"></i> Temporizador</h2>

			<div class="display">
				<span class="oculto" id="temp-hms">00:00:00</span>
			</div>

			<div class="temp-inputs">
				<div class="input-group">
					<label for="input-h">Horas</label>
					<button id="btn-dec-h" type="button">-</button>
					<input type="number" id="input-h" min="0" max="23" value="0">
					<button id="btn-inc-h" type="button">+</button>
				</div>
				<div class="input-group">
					<label for="input-m">Minutos</label>
					<button id="btn-dec-m" type="button">-</button>
					<input type="number" id="input-m" min="0" max="59" value="0">
					<button id="btn-inc-m" type="button">+</button>
				</div>
				<div class="input-group">
					<label for="input-s">Segundos</label>
					<button id="btn-dec-s" type="button">-</button>
					<input type="number" id="input-s" min="0" max="59" value="0">
					<button id="btn-dec-s" type="button">+</button>
				</div>
			</div>

			<div class="botones" id="botones">
				<button id="temp-start" class="boton temp-start" type="button"><i class="ti ti-player-play"
						aria-hidden="true"></i> Start</button>
				<button id="temp-stop" class="boton temp-stop oculto" type="button"><i class="ti ti-player-pause"
						aria-hidden="true"></i> Stop</button>
				<button id="temp-reset" class="boton temp-reset oculto" type="button"><i class="ti ti-refresh"
						aria-hidden="true"></i> Reset</button>
			</div>
		</section>
	</main>

	<footer>
		<section class="info">
			<p><a target="_blank" rel="noopener noreferrer" href="https://github.com/AntMendez"><i
						class="ti ti-brand-github"></i></a></p>
			<button class="theme_toggle" type="button" aria-label="Cambiar tema">
		</section>
	</footer>

	<script src="script.js"></script>
</body>

</html>
